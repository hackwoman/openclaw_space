<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="450" fill="#0d1117" rx="20"/>
  
  <!-- Title -->
