<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="450" fill="#87CEEB"/>
  <ellipse cx="200" cy="420" rx="180" ry="30" fill="#90EE90"/>
  
  <!-- Title -->
  <text x="200" y="35" text-anchor="middle" fill="#333" font-size="24" font-weight="bold">🦞 OpenClaw 的日常</text>
  
  <!-- Body (Lobster/Crab shape) -->
  <ellipse cx="200" cy="250" rx="80" ry="100" fill="#FF6B6B"/>
  <ellipse cx="200" cy="250" rx="70" ry="90" fill="#FF8A8A"/>
  
  <!-- Belly -->
  <ellipse cx="200" cy="270" rx="50" ry="60" fill="#FFB6B6"/>
  
  <!-- Eyes -->
  <ellipse cx="160" cy="180" rx="25" ry="30" fill="white" stroke="#333" stroke-width="2"/>
  <ellipse cx="240" cy="180" rx="25" ry="30" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="165" cy="185" r="12" fill="#333"/>
  <circle cx="245" cy="185" r="12" fill="#333"/>
  <circle cx="168" cy="182" r="4" fill="white"/>
  <circle cx="248" cy="182" r="4" fill="white"/>
  
  <!-- Eyebrows (expressive) -->
  <path d="M135 155 Q160 145 185 155" stroke="#8B4513" stroke-width="4" fill="none"/>
  <path d="M215 155 Q240 145 265 155" stroke="#8B4513" stroke-width="4" fill="none"/>
  
  <!-- Antennae -->
  <line x1="150" y1="120" x2="120" y2="60" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round"/>
  <line x1="250" y1="120" x2="280" y2="60" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="55" r="12" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <circle cx="280" cy="55" r="12" fill="#FFD700" stroke="#333" stroke-width="2"/>
  
  <!-- Smile -->
  <path d="M160 230 Q200 270 240 230" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Blush -->
  <ellipse cx="130" cy="220" rx="15" ry="10" fill="#FFB6C1" opacity="0.7"/>
  <ellipse cx="270" cy="220" rx="15" ry="10" fill="#FFB6C1" opacity="0.7"/>
  
  <!-- Claws -->
  <ellipse cx="80" cy="280" rx="35" ry="50" fill="#FF6B6B" stroke="#333" stroke-width="2"/>
  <ellipse cx="80" cy="280" rx="25" ry="40" fill="#FF8A8A"/>
  <path d="M55 260 L45 240 M105 260 L115 240" stroke="#333" stroke-width="3"/>
  
  <ellipse cx="320" cy="280" rx="35" ry="50" fill="#FF6B6B" stroke="#333" stroke-width="2"/>
  <ellipse cx="320" cy="280" rx="25" ry="40" fill="#FF8A8A"/>
  <path d="M295 260 L285 240 M345 260 L355 240" stroke="#333" stroke-width="3"/>
  
  <!-- Legs -->
  <path d="M150 340 L130 400" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round"/>
  <path d="M170 350 L160 400" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round"/>
  <path d="M230 350 L240 400" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round"/>
  <path d="M250 340 L270 400" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Speech bubble -->
  <ellipse cx="320" cy="100" rx="70" ry="40" fill="white" stroke="#333" stroke-width="2"/>
  <polygon points="280,130 260,160 300,140" fill="white" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="130" x2="260" y2="160" stroke="white" stroke-width="3"/>
  <line x1="280" y1="130" x2="300" y2="140" stroke="white" stroke-width="3"/>
  <text x="320" y="95" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Hello!</text>
  <text x="320" y="115" text-anchor="middle" fill="#333" font-size="12">I'm OpenClaw</text>
  
  <!-- Sparkles -->
  <text x="50" y="100" fill="#FFD700" font-size="20">✨</text>
  <text x="350" y="180" fill="#FFD700" font-size="16">✨</text>
  <text x="100" y="380" fill="#FFD700" font-size="18">✨</text>
</svg>
