<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="400" fill="#1a1a2e" rx="20"/>
  
  <!-- Title -->
  <text x="250" y="40" text-anchor="middle" fill="#ffd700" font-size="20" font-weight="bold">📈 上周市场情绪分析</text>
  
  <!-- Fear-Greed Meter -->
  <text x="250" y="80" text-anchor="middle" fill="white" font-size="14">恐惧 ← → 贪婪</text>
  
  <!-- Meter background -->
  <rect x="50" y="100" width="400" height="30" rx="15" fill="#2d3436"/>
  
  <!-- Gradient sections -->
  <rect x="50" y="100" width="80" height="30" rx="15" fill="#d63031"/>
  <rect x="130" y="100" width="80" height="30" fill="#e17055"/>
  <rect x="210" y="100" width="80" height="30" fill="#fdcb6e"/>
  <rect x="290" y="100" width="80" height="30" fill="#00b894"/>
  <rect x="370" y="100" width="80" height="30" rx="15" fill="#00cec9"/>
  
  <!-- Current position indicator -->
  <polygon points="280,95 270,80 290,80" fill="#ffd700"/>
  <text x="280" y="75" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">当前位置</text>
  
  <!-- Labels -->
  <text x="90" y="150" text-anchor="middle" fill="#d63031" font-size="12">极度恐惧</text>
  <text x="170" y="150" text-anchor="middle" fill="#e17055" font-size="12">恐惧</text>
  <text x="250" y="150" text-anchor="middle" fill="#fdcb6e" font-size="12">中性</text>
  <text x="330" y="150" text-anchor="middle" fill="#00b894" font-size="12">贪婪</text>
  <text x="410" y="150" text-anchor="middle" fill="#00cec9" font-size="12">极度贪婪</text>
  
  <!-- Key Metrics -->
  <text x="50" y="200" fill="white" font-size="14" font-weight="bold">关键指标:</text>
  
  <!-- Volume -->
  <text x="50" y="230" fill="#ffd700" font-size="12">📊 成交量:</text>
  <rect x="150" y="218" width="200" height="16" rx="8" fill="#2d3436"/>
  <rect x="150" y="218" width="150" height="16" rx="8" fill="#00cec9"/>
  <text x="360" y="230" fill="white" font-size="11">放大 25%</text>
  
  <!-- Northbound Flow -->
  <text x="50" y="260" fill="#ffd700" font-size="12">🌐 北向资金:</text>
  <rect x="150" y="248" width="200" height="16" rx="8" fill="#2d3436"/>
  <rect x="150" y="248" width="120" height="16" rx="8" fill="#00b894"/>
  <text x="360" y="260" fill="white" font-size="11">净流入 85亿</text>
  
  <!-- VIX -->
  <text x="50" y="290" fill="#ffd700" font-size="12">⚡ 波动率(VIX):</text>
  <rect x="150" y="278" width="200" height="16" rx="8" fill="#2d3436"/>
  <rect x="150" y="278" width="80" height="16" rx="8" fill="#fdcb6e"/>
  <text x="360" y="290" fill="white" font-size="11">18.5 (中等)</text>
  
  <!-- Summary -->
  <rect x="50" y="320" width="400" height="60" rx="10" fill="#2d3436" stroke="#ffd700" stroke-width="2"/>
  <text x="250" y="345" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">💡 市场总结</text>
  <text x="250" y="365" text-anchor="middle" fill="white" font-size="12">市场情绪偏谨慎，AI板块持续活跃，建议关注科技成长股</text>
</svg>
